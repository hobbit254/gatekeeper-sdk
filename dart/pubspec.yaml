name: gatekeeper_sdk
description: Gatekeeper client SDK for Flutter and Dart apps - PKCE sign-in, refresh, step-up (ADR-0051).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  crypto: ^3.0.6
  http: ^1.2.2

dev_dependencies:
  lints: ^5.0.0
  pointycastle: ^3.9.1 # DPoP test signer only; apps sign in the platform keystore (ADR-0070)
  test: ^1.25.8
